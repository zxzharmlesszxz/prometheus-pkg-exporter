rule_files:
  - ../prometheus-pkg-exporter.yml

evaluation_interval: 1m

tests:
  - name: Exporter collection health alerts honor hold times
    interval: 1m
    input_series:
      - series: 'up{job="pkg-exporter",instance="down"}'
        values: '0x40'
      - series: 'pkg_exporter_last_collection_success{job="pkg-exporter",instance="failed"}'
        values: '0x40'
      - series: 'pkg_exporter_last_successful_collection_timestamp_seconds{job="pkg-exporter",instance="stale"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 6m
        alertname: PkgExporterDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: pkg-exporter
              instance: down
            exp_annotations:
              summary: Package exporter is down (down)
              description: |
                Prometheus cannot scrape prometheus-pkg-exporter for at least 5 minutes.
      - eval_time: 11m
        alertname: PkgExporterCollectionFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              job: pkg-exporter
              instance: failed
            exp_annotations:
              summary: Package exporter collection is failing (failed)
              description: |
                prometheus-pkg-exporter has not completed a successful collection for at least 10 minutes.
      - eval_time: 16m
        alertname: PkgExporterCollectionStale
        exp_alerts:
          - exp_labels:
              severity: warning
              job: pkg-exporter
              instance: stale
            exp_annotations:
              summary: Package exporter collection is stale (stale)
              description: |
                prometheus-pkg-exporter has not refreshed package data successfully for more than 5 minutes.

  - name: Collection performance alerts use rates
    interval: 1m
    input_series:
      - series: 'pkg_exporter_package_collection_duration_seconds_bucket{job="pkg-exporter",instance="slow",le="10"}'
        values: '0+0x40'
      - series: 'pkg_exporter_package_collection_duration_seconds_bucket{job="pkg-exporter",instance="slow",le="20"}'
        values: '0+1x40'
      - series: 'pkg_exporter_package_collection_duration_seconds_bucket{job="pkg-exporter",instance="slow",le="+Inf"}'
        values: '0+1x40'
      - series: 'pkg_exporter_package_index_cache_misses_total{job="pkg-exporter",instance="cache-miss"}'
        values: '0+2x40'
    alert_rule_test:
      - eval_time: 31m
        alertname: PkgExporterCollectionSlow
        exp_alerts:
          - exp_labels:
              severity: warning
              job: pkg-exporter
              instance: slow
            exp_annotations:
              summary: Package exporter collection is slow (slow)
              description: |
                The 95th percentile package collection duration is above 10 seconds for at least 15 minutes.
      - eval_time: 31m
        alertname: PkgExporterPackageIndexCacheMissRateHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              job: pkg-exporter
              instance: cache-miss
            exp_annotations:
              summary: Package exporter package index cache miss rate is high (cache-miss)
              description: |
                prometheus-pkg-exporter is reparsing apt package indexes more often than expected.

  - name: Package state alerts report current problems
    interval: 1m
    input_series:
      - series: 'pkg_exporter_upgrade_metrics_valid{job="pkg-exporter",instance="missing-cache"}'
        values: '0x40'
      - series: 'pkg_packages_broken_count{job="pkg-exporter",instance="broken"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 31m
        alertname: PkgUpgradeMetricsInvalid
        exp_alerts:
          - exp_labels:
              severity: warning
              job: pkg-exporter
              instance: missing-cache
            exp_annotations:
              summary: Package upgrade metrics are invalid (missing-cache)
              description: |
                The configured package sources did not provide usable dpkg and apt data. Upgrade-related metrics are unknown until both sources are valid.
      - eval_time: 16m
        alertname: PkgBrokenPackagesPresent
        exp_alerts:
          - exp_labels:
              severity: warning
              job: pkg-exporter
              instance: broken
            exp_annotations:
              summary: Broken Debian packages detected (broken)
              description: |
                The exporter reports one or more broken packages from apt diagnostics.

  - name: Stale package index cache honors hold time
    interval: 1m
    input_series:
      - series: 'pkg_exporter_apt_lists_last_modified_timestamp_seconds{job="pkg-exporter",instance="stale-cache"}'
        values: '1x3300'
      - series: 'pkg_exporter_upgrade_metrics_valid{job="pkg-exporter",instance="stale-cache"}'
        values: '1x3300'
    alert_rule_test:
      - eval_time: 3242m
        alertname: PkgPackageIndexCacheStale
        exp_alerts:
          - exp_labels:
              severity: warning
              job: pkg-exporter
              instance: stale-cache
            exp_annotations:
              summary: APT package index cache is stale (stale-cache)
              description: |
                The newest apt package index or release metadata file is older than 48 hours. Upgrade-related metrics may be based on stale apt metadata.

  - name: Available update alerts remain pending before long hold times
    interval: 1m
    input_series:
      - series: 'pkg_packages_upgradable_count{job="pkg-exporter",instance="security",category="security"}'
        values: '2x2'
      - series: 'pkg_exporter_upgrade_metrics_valid{job="pkg-exporter",instance="security"}'
        values: '1x2'
      - series: 'pkg_packages_upgradable_count{job="pkg-exporter",instance="updates",category="all"}'
        values: '3x2'
      - series: 'pkg_exporter_upgrade_metrics_valid{job="pkg-exporter",instance="updates"}'
        values: '1x2'
    alert_rule_test:
      - eval_time: 1m
        alertname: PkgSecurityUpdatesAvailable
        exp_alerts: []
      - eval_time: 1m
        alertname: PkgUpdatesAvailable
        exp_alerts: []

  - name: Package source state alerts use latest-scrape gauges
    interval: 1m
    input_series:
      - series: 'pkg_status_database_up{job="pkg-exporter",instance="unreadable"}'
        values: '0x20'
      - series: 'pkg_apt_lists_valid{job="pkg-exporter",instance="invalid"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 11m
        alertname: PkgPackageSourceUnreadable
        exp_alerts:
          - exp_labels:
              severity: warning
              job: pkg-exporter
              instance: unreadable
            exp_annotations:
              summary: Package source is unreadable (unreadable)
              description: |
                The exporter cannot read the dpkg status database or apt lists source.
      - eval_time: 11m
        alertname: PkgPackageSourceInvalid
        exp_alerts:
          - exp_labels:
              severity: warning
              job: pkg-exporter
              instance: invalid
            exp_annotations:
              summary: Package source is invalid (invalid)
              description: |
                The dpkg status database or apt lists source did not produce valid package data.

  - name: Package source error alerts use counter increases
    interval: 1m
    input_series:
      - series: 'pkg_status_database_read_errors_total{job="pkg-exporter",instance="read-errors"}'
        values: '0x14 1x16'
      - series: 'pkg_apt_lists_parse_errors_total{job="pkg-exporter",instance="parse-errors"}'
        values: '0x14 1x16'
      - series: 'pkg_status_database_read_errors_total{job="pkg-exporter",instance="old-read-error"}'
        values: '7x31'
      - series: 'pkg_apt_lists_parse_errors_total{job="pkg-exporter",instance="old-parse-error"}'
        values: '9x31'
    alert_rule_test:
      - eval_time: 30m
        alertname: PkgPackageSourceReadErrors
        exp_alerts:
          - exp_labels:
              severity: warning
              job: pkg-exporter
              instance: read-errors
            exp_annotations:
              summary: Package source read errors detected (read-errors)
              description: |
                One or more package source reads failed during the last 30 minutes.
      - eval_time: 30m
        alertname: PkgPackageSourceParseErrors
        exp_alerts:
          - exp_labels:
              severity: warning
              job: pkg-exporter
              instance: parse-errors
            exp_annotations:
              summary: Package source parse errors detected (parse-errors)
              description: |
                One or more package sources could not be parsed during the last 30 minutes.

  - name: Package problem alerts match hyphenated job names
    interval: 1m
    input_series:
      - series: 'pkg_reboot_required{job="prometheus-pkg-exporter",instance="reboot"}'
        values: '1x50000'
    alert_rule_test:
      - eval_time: 31d
        alertname: PkgRebootRequired
        exp_alerts:
          - exp_labels:
              severity: warning
              job: prometheus-pkg-exporter
              instance: reboot
            exp_annotations:
              summary: Node reboot required after package changes (reboot)
              description: |
                The configured reboot-required marker is present and the node should be rebooted when operationally safe.
